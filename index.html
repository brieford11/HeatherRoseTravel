<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Uncharted Journey Awaits</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: 'Montserrat', sans-serif;
            color: #2b232c;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Continuous Vector Backdrop: Explicitly mapping the Scottish landscape structure */
        .scotland-vector-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* White border tracking frame */
        .outer-frame {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            pointer-events: none;
            z-index: 2;
        }

        /* Central Elegant Presentation Card */
        .container {
            max-width: 580px;
            padding: 55px 45px;
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 45px rgba(43, 35, 44, 0.05);
            border-radius: 8px;
            animation: elegantFade 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .travel-crest {
            font-size: 1.5rem;
            margin-bottom: 25px;
            display: block;
            color: #bba170;
            opacity: 0.85;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.3rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 7px;
            line-height: 1.5;
            margin: 0 0 20px 0;
            color: #1a141b;
        }

        h1 span {
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            text-transform: lowercase;
            color: #705377; /* Soft Scottish heather purple */
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: rgba(187, 161, 112, 0.5);
            margin: 0 auto 25px auto;
        }

        .subtext {
            font-size: 0.72rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #594e5a;
            font-weight: 400;
        }

        @keyframes elegantFade {
            from { opacity: 0; transform: scale(0.97) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
    <!-- Editorial Typography Configuration -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Embedded Vector Landscape Graph -->
    <svg class="scotland-vector-bg" xmlns="http://w3.org" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <!-- Sky Gradient -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f2edf5"/>
            <stop offset="100%" stop-color="#e6ecf2"/>
        </linearGradient>
        <rect width="1440" height="900" fill="url(#skyGrad)"/>

        <!-- Distant Mountain Range (Misty Blue-Gray Mountains) -->
        <path d="M0 520 L0 380 Q240 280 480 360 T1100 320 Q1270 290 1440 370 L1440 900 L0 900 Z" fill="#cad5e0" opacity="0.6"/>
        <path d="M0 550 L0 420 Q350 310 700 410 T1440 380 L1440 900 L0 900 Z" fill="#bccad8" opacity="0.8"/>

        <!-- Middle Ridges (Soft Scottish Heather Purple Ridges) -->
        <path d="M0 610 L0 490 Q200 420 520 510 T1150 460 Q1295 440 1440 500 L1440 900 L0 900 Z" fill="#d3c3de" opacity="0.7"/>
        <path d="M0 660 L0 540 Q380 460 800 560 T1440 510 L1440 900 L0 900 Z" fill="#c3aed4"/>

        <!-- Valley Floor Fields (Wild Rose Pink / Blush Accents) -->
        <path d="M0 720 L0 600 Q250 540 600 640 T1440 580 L1440 900 L0 900 Z" fill="#eed0da"/>
        <path d="M0 780 L0 660 Q400 580 900 690 T1440 630 L1440 900 L0 900 Z" fill="#e4beca"/>

        <!-- Foreground Ground Pasture (Soft Moss Green Highlands) -->
        <path d="M0 840 L0 710 Q300 640 750 740 T1440 680 L1440 900 L0 900 Z" fill="#cfded3"/>
        <path d="M0 900 L0 760 Q450 690 950 780 T1440 730 L1440 900 L0 900 Z" fill="#bccebf"/>
    </svg>

    <div class="outer-frame"></div>

    <div class="container">
        <span class="travel-crest">🧭</span>
        <h1>An Uncharted Journey<br>is <span>in preparation</span></h1>
        <div class="divider"></div>
        <div class="subtext">A Distinguished Odyssey Awaits</div>
    </div>

</body>
</html>
